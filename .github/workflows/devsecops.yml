name: DevSecOps

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Segredo vazado? Varre todo o histórico do Git.
  gitleaks:
    name: Gitleaks (segredos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rodar Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source=/repo --redact --verbose --exit-code=1

  # 2) Código vulnerável? Análise estática (SAST).
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar Semgrep
        run: |
          pip install --quiet semgrep==1.185.0
          semgrep scan --error --metrics=off \
            --config p/python --config p/dockerfile --config p/terraform --config p/secrets

  # 3) Testes da aplicação
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements-dev.txt
      - run: pytest -q

  # 4) Build da imagem, Trivy e publicação no GHCR
  build:
    name: Build + Trivy + Push
    needs: [gitleaks, semgrep, testes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nome da imagem (minúsculas)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          docker build --build-arg APP_VERSION=${{ github.sha }} \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Instalar Trivy (repositório oficial assinado da Aqua)
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y -qq trivy
          trivy --version

      - name: Trivy - vulnerabilidades da imagem
        run: trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$IMAGE:${{ github.sha }}"

      - name: Trivy - dependências e configuração (requirements, Dockerfile, Terraform)
        run: trivy fs --scanners vuln,misconfig --severity CRITICAL,HIGH --exit-code 1 .

      - name: Login no GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # 5) Deploy: a VM puxa a imagem nova sozinha (deploy por pull, sem porta de
  #    administração aberta). Aqui o pipeline confirma que a versão nova entrou no ar.
  deploy:
    name: Deploy (verificação em produção)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: ${{ vars.MVP_URL }}
    steps:
      - name: Aguardar a versão ${{ github.sha }} no ar
        env:
          MVP_URL: ${{ vars.MVP_URL }}
        run: |
          if [ -z "$MVP_URL" ]; then
            echo "::warning::MVP_URL ainda não configurada (Settings > Secrets and variables > Actions > Variables). Verificação de deploy pulada."
            exit 0
          fi
          for i in $(seq 1 30); do
            versao=$(curl -fsS "$MVP_URL/health" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("versao",""))' || true)
            echo "tentativa $i: versão no ar = ${versao:-indisponível}"
            if [ "$versao" = "${{ github.sha }}" ]; then
              echo "Deploy concluído: $MVP_URL está na versão ${{ github.sha }}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::A versão nova não entrou no ar em 5 minutos"
          exit 1
