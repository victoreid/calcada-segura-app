global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: calcada-segura-mvp
    scheme: https
    metrics_path: /metrics
    basic_auth:
      username: prometheus
      password_file: /etc/prometheus/metrics_password
    static_configs:
      # TROQUE pelo domÃ­nio da saÃ­da "url_mvp" do Terraform (sem https://)
      - targets: ["calcada-segura-nc-6iey3.northcentralus.cloudapp.azure.com"]
        labels:
          ambiente: producao
